# Attaches the plugin files (main.js, manifest.json, styles.css) to a release, straight from the
# tagged code, so they can never be the wrong files. Runs by itself when a release is published:
# no need to upload anything by hand. To repair an existing release, open Actions → "Attach plugin
# files to release" → Run workflow, and type the release's tag.
name: Attach plugin files to release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to fix (for example 0.1.7)
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check the files are the real plugin
        run: |
          node --check main.js
          head -c 40 main.js | grep -q "use strict"
          node -e "const m = require('./manifest.json'); if (m.id !== 'inkbook') throw new Error('bad manifest')"

      - name: Remove wrongly named copies
        run: |
          for f in main.js.txt manifest.json.txt styles.css.txt; do
            gh release delete-asset "$TAG" "$f" --yes 2>/dev/null || true
          done

      - name: Attach main.js, manifest.json and styles.css
        run: gh release upload "$TAG" main.js manifest.json styles.css --clobber
